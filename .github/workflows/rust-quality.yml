name: Rust Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: {group: Public-local, labels: [self-hosted, Linux, X64]}

    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Ubuntu container tools
        working-directory: ${{ github.workspace }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo ca-certificates curl git git-lfs jq unzip xz-utils python3 python3-venv python3-pip build-essential pkg-config libssl-dev libncurses-dev file wget gnupg
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install stable Rust with required components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            blueprint-compiler \
            build-essential \
            libadwaita-1-dev \
            libepoxy-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config

      - name: Build libghostty for embedding
        run: |
          cd ghostty
          zig build -Dapp-runtime=none -Doptimize=ReleaseFast -Dcpu=baseline

      - name: Run repository quality checks
        run: ./scripts/check.sh

  gtk-host-smoke:
    name: GTK host smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: {group: Public-local, labels: [self-hosted, Linux, X64]}

    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Ubuntu container tools
        working-directory: ${{ github.workspace }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo ca-certificates curl git git-lfs jq unzip xz-utils python3 python3-venv python3-pip build-essential pkg-config libssl-dev libncurses-dev file wget gnupg
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            blueprint-compiler \
            build-essential \
            jq \
            libadwaita-1-dev \
            libepoxy-dev \
            libgl1-mesa-dri \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            util-linux \
            weston

      - name: Build libghostty for embedding
        run: |
          cd ghostty
          zig build -Dapp-runtime=none -Doptimize=ReleaseFast -Dcpu=baseline

      - name: Run live GTK host smoke test
        env:
          LIMUX_SMOKE_PROFILE: debug
        run: ./scripts/xvfb-smoke-test.sh
